services:
  # ---- Dev container ----
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      target: devcontainer
    volumes:
      - ..:/workspaces/app:cached   # mount repo root
    command: sleep infinity         # keep alive for VS Code
    env_file:
      - path: .devcontainer.env
        required: false
    environment:
      PYTHONPATH: /workspaces/app/src
      DOCLING_URL: http://docling:5001
    depends_on:
      docling:
        condition: service_healthy

  # ---- Docling server (public image, models pre-baked) ----
  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

    # Reachable from your laptop: http://localhost:5001/docs  (UI: /ui)
    ports:
      - "127.0.0.1:5001:5001"

    # Optional guard so a big PDF can't eat the whole laptop
    mem_limit: "6g"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "5001"
      UVICORN_WORKERS: "1"

      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_LOG_LEVEL: "INFO"
      DOCLING_SERVE_ENG_KIND: "local"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"

      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "600"   # long PDFs on CPU are slow
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      DOCLING_SERVE_MAX_NUM_PAGES: "200"
      DOCLING_SERVE_MAX_FILE_SIZE: "104857600"    # 100 MB

      DOCLING_NUM_THREADS: "4"
      DOCLING_DEVICE: "cpu"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3); sys.exit(0 if r.status == 200 else 1)\"",
        ]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 10
